name: build-static-llama-cpp

# Builds Graviton2 (Neoverse N1) tuned static llama.cpp archives on a GitHub-managed
# ARM64 runner (Neoverse N2, backward-compatible with N1), inside a pinned AL2023
# container. Publishes verified artifacts as a GitHub Release on tag push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create releases / upload assets

jobs:
  build:
    runs-on: ubuntu-24.04-arm      # GitHub-hosted ARM64 (Neoverse N2)
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned AL2023 aarch64 digest
        id: img
        run: |
          set -euo pipefail
          # AL2023 is resolved-and-recorded provenance, not a runtime pin. Use the optional
          # AL2023_DIGEST override if set (reproducible build); otherwise resolve the current
          # index digest for the tag. Either way it is recorded in build-info.json, and the
          # build-env envelope (gcc major / glibc floor) is gated in build.sh.
          source scripts/config.env
          digest="${AL2023_DIGEST:-}"
          if [[ -z "${digest}" ]]; then
            digest="$(docker manifest inspect amazonlinux:2023 --verbose \
              | jq -r 'if type=="array" then .[0] else . end | .Descriptor.digest' 2>/dev/null || true)"
            [[ -n "${digest}" && "${digest}" != "null" ]] \
              || digest="$(docker buildx imagetools inspect amazonlinux:2023 --format '{{json .Manifest.Digest}}' | tr -d '"')"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=amazonlinux:2023@${digest}" >> "$GITHUB_OUTPUT"

      - name: Build builder image
        run: |
          docker build --build-arg AL2023_DIGEST="2023@${{ steps.img.outputs.digest }}" \
            -t static-llama-builder:ci .

      - name: Build + smoke + bench + package (in container)
        env:
          SMOKE_MODEL_URL: ${{ vars.SMOKE_MODEL_URL }}
          SMOKE_MODEL_SHA256: ${{ vars.SMOKE_MODEL_SHA256 }}
          COMPILER_IMAGE: ${{ steps.img.outputs.image }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            -e SMOKE_MODEL_URL -e SMOKE_MODEL_SHA256 -e COMPILER_IMAGE \
            static-llama-builder:ci bash -euo pipefail -c '
              git config --global --add safe.directory "*"
              bash scripts/build.sh
              export SMOKE_MODEL="$(bash smoke/fixtures/fetch-model.sh)"
              export RESULTS=/work/.build/results; mkdir -p "$RESULTS"
              SMOKE_RESULT="$RESULTS/smoke.json" \
                cargo run --release --manifest-path smoke/Cargo.toml
              bash scripts/bench.sh
              bash scripts/package.sh
            '

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-llama-cpp-aarch64-graviton2
          path: dist/**

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          tar czf "../static-llama-cpp-${GITHUB_REF_NAME}-aarch64-graviton2.tar.gz" .
          cd ..
          gh release create "${GITHUB_REF_NAME}" \
            --title "static-llama-cpp ${GITHUB_REF_NAME}" \
            --notes-file dist/build-info.json \
            "static-llama-cpp-${GITHUB_REF_NAME}-aarch64-graviton2.tar.gz" \
            dist/SHA256SUMS dist/build-info.json dist/CONTRACT.md
