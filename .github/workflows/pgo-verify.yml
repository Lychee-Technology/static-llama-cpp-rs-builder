name: verify-pgo

# Manually-triggered verification of the opt-in PGO build path (scripts/build.sh PGO=1),
# for both production variants: aarch64-graviton2 on the GitHub-managed ARM64 (Neoverse N2)
# runner and x86_64-v3 on the GitHub-managed x86-64 runner (which must pass the x86-64-v3
# gate), each in a resolved AL2023 container of its own architecture, as in release.yml.
# Parameterizes the PGO training model, then asserts: the image ships the PGO toolchain,
# the 3-phase build produces a recorded profile trained for THAT architecture and CPU
# baseline (x86_64: instrumented + trained with -march=x86-64-v3 on a native v3 host;
# profiles are never shared between architectures), and bench reports a non-regressing
# pgo_gain plus a passing (both-PGO) parity check.
#
# The profile is quant-type-specific, so pass an IQ4_NL (or whatever you deploy) embedding
# GGUF. That one model serves as BOTH the PGO training model and the bench workload model,
# so training / measurement / deploy shapes match.
#
# Native-only (runner arch == container arch == compiler arch == artifact arch; no cross
# compilation, no CPU emulation); see release.yml.

on:
  workflow_dispatch:
    inputs:
      pgo_model_url:
        description: "URL of the embedding GGUF to train the PGO profile on (the quant you deploy, e.g. IQ4_NL). Falls back to the PGO_MODEL_URL repo variable."
        required: false
        default: ""
      pgo_model_sha256:
        description: "Expected sha256 of the PGO training model. Falls back to the PGO_MODEL_SHA256 repo variable."
        required: false
        default: ""
      pgo_train_iters:
        description: "PGO training iterations (encodes of the training sequence)."
        required: false
        default: "300"
      min_pgo_gain:
        description: "Minimum acceptable pgo_gain (source_pgo / source_nopgo). The run fails below this; 1.00 = require no regression."
        required: false
        default: "1.00"

permissions:
  contents: read

jobs:
  verify-pgo:
    name: verify-pgo (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: aarch64-graviton2
            arch: aarch64
            runner: ubuntu-24.04-arm   # GitHub-hosted ARM64 (Neoverse N2)
          - profile: x86_64-v3
            arch: x86_64
            runner: ubuntu-24.04       # GitHub-hosted x86-64; must pass the x86-64-v3 gate
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Assert native ${{ matrix.arch }} runner (no cross-compilation / emulation)
        run: bash scripts/assert-native-runner.sh "${{ matrix.arch }}"

      - name: Resolve native docker platform
        id: plat
        env:
          PROFILE: ${{ matrix.profile }}
          WANT_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # From the runner itself (asserted native above): the image is always native.
          m="$(uname -m)"
          [[ "${m}" == "${WANT_ARCH}" ]] || { echo "::error::runner is ${m}, matrix wants ${WANT_ARCH}" >&2; exit 1; }
          case "${m}" in
            aarch64) docker_arch=arm64 ;;
            x86_64)  docker_arch=amd64 ;;
            *) echo "::error::unsupported runner architecture ${m}" >&2; exit 1 ;;
          esac
          source scripts/config.env
          [[ "${TARGET_PROFILE}" == "${PROFILE}" ]] \
            || { echo "::error::config.env selects '${TARGET_PROFILE}' on ${m}, matrix wants '${PROFILE}'" >&2; exit 1; }
          echo "docker_arch=${docker_arch}" >> "$GITHUB_OUTPUT"

      - name: Resolve PGO training model (input or repo variable)
        id: model
        env:
          IN_URL: ${{ inputs.pgo_model_url }}
          IN_SHA: ${{ inputs.pgo_model_sha256 }}
          VAR_URL: ${{ vars.PGO_MODEL_URL }}
          VAR_SHA: ${{ vars.PGO_MODEL_SHA256 }}
        run: |
          set -euo pipefail
          url="${IN_URL:-}"; [[ -z "${url}" ]] && url="${VAR_URL:-}"
          sha="${IN_SHA:-}"; [[ -z "${sha}" ]] && sha="${VAR_SHA:-}"
          if [[ -z "${url}" || -z "${sha}" ]]; then
            echo "::error::provide pgo_model_url + pgo_model_sha256 inputs, or set PGO_MODEL_URL / PGO_MODEL_SHA256 repo variables"
            exit 1
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Resolve AL2023 ${{ matrix.arch }} digest
        id: img
        env:
          DOCKER_ARCH: ${{ steps.plat.outputs.docker_arch }}
        run: |
          set -euo pipefail
          # Resolved-and-recorded provenance, not a runtime pin (mirrors release.yml). Must
          # select THIS runner's manifest entry — an index/foreign digest would
          # exec-format-error (or be emulated).
          source scripts/config.env
          digest="${AL2023_DIGEST:-}"
          if [[ -z "${digest}" ]]; then
            digest="$(docker manifest inspect amazonlinux:2023 \
              | jq -r --arg a "${DOCKER_ARCH}" '.manifests[] | select(.platform.architecture==$a and .platform.os=="linux") | .digest' \
              | head -n1)"
          fi
          [[ -n "${digest}" && "${digest}" != "null" ]] || { echo "could not resolve ${DOCKER_ARCH} digest" >&2; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=amazonlinux:2023@${digest}" >> "$GITHUB_OUTPUT"

      - name: Build builder image (native; also proves the PGO deps llvm18 + compiler-rt resolve)
        env:
          DOCKER_ARCH: ${{ steps.plat.outputs.docker_arch }}
        run: |
          set -euo pipefail
          docker build --platform "linux/${DOCKER_ARCH}" \
            --build-arg AL2023_DIGEST="2023@${{ steps.img.outputs.digest }}" \
            -t static-llama-builder:ci .
          img_arch="$(docker image inspect --format '{{.Architecture}}' static-llama-builder:ci)"
          [[ "${img_arch}" == "${DOCKER_ARCH}" ]] \
            || { echo "::error::builder image is ${img_arch}, runner is ${DOCKER_ARCH}" >&2; exit 1; }

      - name: Verify PGO toolchain present in image
        run: |
          docker run --rm static-llama-builder:ci bash -euo pipefail -c '
            pd="$(command -v llvm-profdata-18 || command -v llvm-profdata || echo /usr/lib64/llvm18/bin/llvm-profdata)"
            [ -x "$pd" ] || { echo "::error::llvm-profdata not found in image"; exit 1; }
            "$pd" --version
            # compiler-rt profile runtime for THIS arch (needed to link -fprofile-generate binaries).
            a="$(uname -m)"
            find / \( -name "libclang_rt.profile-${a}.a" -o -path "*/${a}-unknown-linux-gnu/libclang_rt.profile.a" \) 2>/dev/null \
              | head -n1 | grep . \
              || { echo "::error::libclang_rt.profile (${a}) not found (compiler-rt package missing)"; exit 1; }
          '

      - name: PGO build + bench + assertions (in container)
        env:
          SMOKE_MODEL_URL: ${{ steps.model.outputs.url }}
          SMOKE_MODEL_SHA256: ${{ steps.model.outputs.sha }}
          PGO_TRAIN_ITERS: ${{ inputs.pgo_train_iters }}
          MIN_PGO_GAIN: ${{ inputs.min_pgo_gain }}
          COMPILER_IMAGE: ${{ steps.img.outputs.image }}
          PROFILE: ${{ matrix.profile }}
          RUNNER_KIND: github-hosted
          RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            -e SMOKE_MODEL_URL -e SMOKE_MODEL_SHA256 -e PGO_TRAIN_ITERS -e MIN_PGO_GAIN -e COMPILER_IMAGE \
            -e PROFILE -e RUNNER_KIND -e RUNNER_LABEL \
            static-llama-builder:ci bash -euo pipefail -c '
              git config --global --add safe.directory "*"
              # One model, used as BOTH PGO_TRAIN_MODEL and the bench workload model.
              export SMOKE_MODEL="$(bash smoke/fixtures/fetch-model.sh)"
              export PGO=1
              export PGO_TRAIN_MODEL="${SMOKE_MODEL}"
              export RESULTS=/work/.build/results; mkdir -p "${RESULTS}"

              echo "::group::PGO build (instrument -> train -> optimize)"
              bash scripts/build.sh
              bash scripts/verify-provenance.sh dist/build-info.json "${PROFILE}"
              echo "::endgroup::"

              echo "::group::PGO bench (pgo_gain + both-PGO parity)"
              bash scripts/bench.sh
              echo "::endgroup::"

              echo "=== build-info pgo block ==="; jq .pgo dist/build-info.json
              echo "=== bench summary ===";        jq "{pgo, pgo_gain, prebuilt_to_source_ratio, passed}" "${RESULTS}/bench.json"

              # --- assertions ---------------------------------------------------------
              jq -e ".pgo.enabled == true"         dist/build-info.json >/dev/null || { echo "::error::pgo not enabled in build-info.json"; exit 1; }
              jq -e ".pgo.profdata_sha256 != null" dist/build-info.json >/dev/null || { echo "::error::pgo.profdata_sha256 not recorded"; exit 1; }
              # The profile was trained for THIS variant (never another architecture/baseline).
              source scripts/config.env
              jq -e --arg a "${TARGET_ARCH}" --arg b "${CPU_BASELINE}" \
                ".pgo.architecture == \$a and .pgo.cpu_baseline == \$b" dist/build-info.json >/dev/null \
                || { echo "::error::pgo profile architecture/baseline does not match ${TARGET_ARCH}/${CPU_BASELINE}"; exit 1; }

              gain="$(jq -r ".pgo_gain" "${RESULTS}/bench.json")"
              passed="$(jq -r ".passed"  "${RESULTS}/bench.json")"
              echo "pgo_gain=${gain}  parity_passed=${passed}  min_gain=${MIN_PGO_GAIN}"
              [ "${passed}" = "true" ] || { echo "::error::parity (prebuilt vs from-source PGO) check failed"; exit 1; }
              awk -v g="${gain}" -v m="${MIN_PGO_GAIN}" "BEGIN{ exit !(g+0 >= m+0) }" \
                || { echo "::error::pgo_gain ${gain} is below the required minimum ${MIN_PGO_GAIN}"; exit 1; }

              echo "PGO verification PASSED (gain=${gain}, parity ok)"
              # Make evidence world-readable for the (non-root) upload step; dist/ is root-owned.
              chmod -R a+rX dist "${RESULTS}" || true
            '

      - name: Upload PGO evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pgo-verify-evidence-${{ matrix.profile }}
          path: |
            dist/build-info.json
            .build/results/bench.json
          if-no-files-found: warn
