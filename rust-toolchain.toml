# Pinned Rust toolchain for reproducible builds.
# Bump deliberately; a change here is a build-input change and must be reflected
# in build-info.json (the "rust" field) and, if it affects output, a contract bump.
#
# No `targets` list on purpose: builds are native-only (aarch64 host -> aarch64 target,
# x86_64 host -> x86_64 target), so the host toolchain's own std is the only one needed.
# Listing a target here would make rustup silently install a foreign std on the other
# arch's hosts, i.e. stage a cross build — which this project forbids (see scripts/lib.sh
# assert_native_host).
[toolchain]
channel = "1.96.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
