# Pinned Rust toolchain for reproducible builds.
# Bump deliberately; a change here is a build-input change and must be reflected
# in build-info.json (the "rust" field) and, if it affects output, a contract bump.
[toolchain]
channel = "1.85.0"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-gnu"]
profile = "minimal"
